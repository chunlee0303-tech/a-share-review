name: Send Daily A-Share Review

on:
  schedule:
    # 每天北京时间 16:00 运行（对应 UTC 时间 08:00）
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Send Email via Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          python3 -c "
          import os, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          sender = os.environ['GMAIL_USER']
          password = os.environ['GMAIL_PASS']
          
          # 你的专属在线网页链接
          pages_url = 'https://chunlee0303-tech.github.io/a-share-review/'

          html_body = '''
          <div style='font-family: -apple-system, BlinkMacSystemFont, \"PingFang SC\", sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 14px; background: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.05);'>
            <h2 style='color: #0b1936; margin-top: 0; font-size: 22px;'>📊 A股每日复盘报告已生成</h2>
            <p style='color: #4b5563; font-size: 14px; line-height: 1.6;'>今日行情已收盘，两市重返2万亿上方，半导体芯片与AI算力主线全面爆发。</p>
            
            <div style='margin: 28px 0; text-align: center;'>
              <a href=\"''' + pages_url + '''\" style='background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%); color: #ffffff; padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 15px; display: inline-block; box-shadow: 0 2px 4px rgba(29,78,216,0.3);'>👉 点击进入网页版查看完整高颜值复盘报告</a>
            </div>
            
            <hr style='border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;' />
            <p style='color: #9ca3af; font-size: 12px; line-height: 1.5; margin-bottom: 0;'>
              提示：网页版支持板块多维筛选、核心个股拆解及个人实盘复盘表交互。系统将于每天北京时间 16:00 准时自动推送本通知。
            </p>
          </div>
          '''

          msg = MIMEMultipart('alternative')
          msg['Subject'] = '【A股每日复盘报告】16:00 准时送达'
          msg['From'] = sender
          msg['To'] = sender

          msg.attach(MIMEText(html_body, 'html', 'utf-8'))

          server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
          server.login(sender, password)
          server.sendmail(sender, sender, msg.as_string())
          server.quit()
          print('带网页链接的高颜值邮件发送成功！')
          "
